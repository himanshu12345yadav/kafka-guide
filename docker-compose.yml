version: "3.9"

services:
  application:
    container_name: "kafka-application"
    hostname: "kafka-server"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    networks:
      kafka-network:
        aliases:
          - "kafka-network"
  kafka:
    container_name: "kafka-server"
    hostname: kafka
    image: "confluentinc/cp-kafka:latest"
    ports:
      - "9092:9092"
      - "9091:9091"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: LISTENER_KAFKA://kafka:9092,LISTENER_LOCALHOST://0.0.0.0:9091
      KAFKA_ADVERTISED_LISTENERS: LISTENER_KAFKA://kafka:9092,LISTENER_LOCALHOST://localhost:9091
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_KAFKA:PLAINTEXT,LISTENER_LOCALHOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_KAFKA
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      kafka-network:
        aliases:
          - kafka
  zookeeper:
    container_name: "kafka-zookeeper"
    hostname: zookeeper
    image: "confluentinc/cp-zookeeper:latest"
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      kafka-network:
        aliases:
          - zookeeper

networks:
  kafka-network:
    driver: bridge
    external: false
    name: "kafka-network"

volumes:
  kafka-volume:
    name: "kafka-volume"